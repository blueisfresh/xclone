services:
  postgres:
    image: postgres:16
    container_name: xclone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xclone
    ports:
      - "5433:5432"
    volumes:
      - xclone_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  xclone_pgdata: